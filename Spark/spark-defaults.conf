spark.driver.extraJavaOptions=-Dfs.defaultFS=hdfs://namenode:8020
spark.executor.extraJavaOptions=-Dfs.defaultFS=hdfs://namenode:8020

spark.sql.catalog.hive=org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.hive.type=hive
spark.sql.catalog.hive.uri=thrift://hive-metastore:9083
spark.sql.catalog.hive.warehouse=hdfs://namenode:8020/user/hive/warehouse

spark.hadoop.fs.s3a.endpoint=http://minio:9000
spark.hadoop.fs.s3a.access.key=test
spark.hadoop.fs.s3a.secret.key=12345678
spark.hadoop.fs.s3a.path.style.access=true
spark.hadoop.fs.s3a.connection.ssl.enabled=false
spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem

spark.jars.packages=org.apache.iceberg:iceberg-spark-runtime-3.2_2.12:1.2.1,org.apache.spark:spark-sql-kafka-0-10_2.12:3.3.2
